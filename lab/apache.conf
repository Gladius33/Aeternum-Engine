ServerName localhost
<VirtualHost *:443>
    DocumentRoot /opt/aeternum/public
    SSLEngine on
    SSLCertificateFile /etc/aeternum-lab/tls.crt
    SSLCertificateKeyFile /etc/aeternum-lab/tls.key
    <Directory /opt/aeternum/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        CGIPassAuth On
        RewriteEngine On
        RewriteRule ^v1/ index.php [END]
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
