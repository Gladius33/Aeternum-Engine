    get:
      operationId: readFrenchAssemblySittingCalendar
      tags: [FrenchParliamentCalendar]
      description: >
        Read pinned and provenance-labelled French parliamentary sitting
        dates and certified conference decisions. The rule is the third
        sitting day after expiration of the Constitutional 48-hour delay;
        scenario days are explicitly fictional and never represented
        as actual historical Assembly sessions.
      parameters:
        - $ref: '#/components/parameters/world'
      responses:
        '200':
          description: Immutable parliamentary date source and scheduled ballot slots
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json: { schema: { type: object, additionalProperties: true } }
        '404': { $ref: '#/components/responses/notFound' }
  /worlds/{world}/france/calendar/motions/{motionId}:
    get:
      operationId: readFrenchAssemblyCensureHearing
      tags: [FrenchParliamentCalendar]
      description: >
        Read the certified censure hearing and roll-call instant, if
        registered by an authorized parliamentary authority. Game
        users cannot create or alter these slots through this API.
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/motionId'
      responses:
        '200':
          description: Scheduled motion with third-sitting-day deadline
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json: { schema: { type: object, additionalProperties: true } }
        '404': { $ref: '#/components/responses/notFound' }

  /worlds/{world}/france/assembly:
    get:
      operationId: readFrenchAssembly
      tags: [FrenchAssembly]
      description: >
        Read historical or explicitly fictional, date-pinned deputy and group
        rosters. The API reports all occupied seats, individual members,
        coalitions and verified roll-call history. No real-world election
        assumptions are implied by fictional scenario data.
      parameters:
        - $ref: '#/components/parameters/world'
      responses:
        '200':
          description: Reviewed Assembly roster and audit state
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json: { schema: { type: object, additionalProperties: true } }
        '404': { $ref: '#/components/responses/notFound' }
  /worlds/{world}/france/assembly/matters:
    post:
      operationId: openFrenchAssemblyAgenda
      tags: [FrenchAssembly]
      description: >
        Only a server-curated and constitutionally pending 49(1), 49(2)
        or 49(3) matter may enter a vote agenda. The client supplies an
        identifier ONLY, not fabricated votes, political pressure, or a
        forged parliamentary programme.
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/idempotency'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [matter_id]
              properties:
                matter_id: { $ref: '#/components/schemas/Identifier' }
      responses:
        '202': { description: Legally linked parliamentary agenda opened }
        '403': { $ref: '#/components/responses/forbidden' }
        '409': { $ref: '#/components/responses/conflict' }
        '412': { $ref: '#/components/responses/precondition' }
        '422': { $ref: '#/components/responses/invalid' }
        '428': { $ref: '#/components/responses/missingPrecondition' }
  /worlds/{world}/france/assembly/matters/{matterId}:
    get:
      operationId: readFrenchAssemblyMatter
      tags: [FrenchAssembly]
      description: >
        Read signed roll-call, group-specific negotiation concessions,
        abstentions and legally pinned constitutional source if available.
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/matterId'
      responses:
        '200':
          description: Assembly matter and optional nominal ballot
          content:
            application/json: { schema: { type: object, additionalProperties: true } }
        '404': { $ref: '#/components/responses/notFound' }
  /worlds/{world}/france/assembly/ballots:
    post:
      operationId: castFrenchHumanDeputyBallot
      tags: [FrenchAssembly]
      description: >
        Record an individual human-controlled deputy vote. Actual control
        of that seat is verified by the authenticated server-side principal.
        AI deputies cannot be impersonated by client JSON. Votes are sealed.
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/idempotency'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [matter_id, deputy_id, choice]
              properties:
                matter_id: { $ref: '#/components/schemas/Identifier' }
                deputy_id: { $ref: '#/components/schemas/Identifier' }
                choice: { type: string, enum: [for, against, abstain, absent] }
      responses:
        '200': { description: Verified unique deputy roll-call choice recorded }
        '403': { $ref: '#/components/responses/forbidden' }
        '409': { $ref: '#/components/responses/conflict' }
        '412': { $ref: '#/components/responses/precondition' }
        '422': { $ref: '#/components/responses/invalid' }
        '428': { $ref: '#/components/responses/missingPrecondition' }
  /worlds/{world}/france/assembly/roll-calls:
    post:
      operationId: certifyFrenchAssemblyNominalRollCall
      tags: [FrenchAssembly]
      description: >
        Trusted clerk finalizes human votes and reproducible deputy-specific
        AI ballots. Confidence is a majority of expressed votes; censure
        counts only yes votes and requires absolute majority of occupied
        Assembly seats. No automatic regime collapse is generated.
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/idempotency'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [matter_id]
              properties:
                matter_id: { $ref: '#/components/schemas/Identifier' }
      responses:
        '200': { description: All deputy ballots certified and auditable }
        '403': { $ref: '#/components/responses/forbidden' }
        '409': { $ref: '#/components/responses/conflict' }
        '412': { $ref: '#/components/responses/precondition' }
        '422': { $ref: '#/components/responses/invalid' }
        '428': { $ref: '#/components/responses/missingPrecondition' }
  /worlds/{world}/france/assembly/coalitions:
    post:
      operationId: recordFrenchAssemblyCoalition
      tags: [FrenchAssembly]
      description: >
        Coalition membership is obtained from a verified internal scenario
        protocol. Clients may submit only the coalition identifier and
        desired active status, not a fabricated list of allied groups.
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/idempotency'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [coalition_id, active]
              properties:
                coalition_id: { $ref: '#/components/schemas/Identifier' }
                active: { type: boolean }
      responses:
        '202': { description: Verified coalition state stored }
        '403': { $ref: '#/components/responses/forbidden' }
        '409': { $ref: '#/components/responses/conflict' }
        '412': { $ref: '#/components/responses/precondition' }
        '422': { $ref: '#/components/responses/invalid' }
        '428': { $ref: '#/components/responses/missingPrecondition' }
  /worlds/{world}/france/assembly/signatures:
    post:
      operationId: sealFrenchAssemblyCensureSignatories
      tags: [FrenchAssembly]
      description: >
        The legislative clerk seals identities of actual sitting deputies,
        sourced from the trusted Assembly signature service. Signature IDs
        cannot be provided in player-controlled request bodies.
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/idempotency'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [motion_id]
              properties:
                motion_id: { $ref: '#/components/schemas/Identifier' }
      responses:
        '202': { description: Parliamentarian identity-verified signature roll sealed }
        '403': { $ref: '#/components/responses/forbidden' }
        '409': { $ref: '#/components/responses/conflict' }
        '412': { $ref: '#/components/responses/precondition' }
        '422': { $ref: '#/components/responses/invalid' }
        '428': { $ref: '#/components/responses/missingPrecondition' }

  /worlds/{world}/france/constitution/presidency/prime-minister-appointments:
    post:
      operationId: appointFrenchPrimeMinisterAfterCensure
      tags: [FrenchConstitution]
      description: >
        Article 50 requires the censured or disapproved government to submit
        resignation. An independently authenticated presidential decree under
        Article 8 appoints a successor PM; the client may submit only the
        certified appointment identifier and simulation time. The service
        independently verifies the formal resignation and appointee.
        No mandatory Assembly investiture is invented and the republic
        is not automatically overthrown.
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/idempotency'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [appointment_id, at]
              properties:
                appointment_id: { $ref: '#/components/schemas/Identifier' }
                at: { type: string, format: date-time }
      responses:
        '200': { description: Verified presidential decree recorded after Article 50 resignation }
        '403': { $ref: '#/components/responses/forbidden' }
        '409': { $ref: '#/components/responses/conflict' }
        '412': { $ref: '#/components/responses/precondition' }
        '422': { $ref: '#/components/responses/invalid' }
        '428': { $ref: '#/components/responses/missingPrecondition' }

  /worlds/{world}/domestic:
    get:
      operationId: readDomesticPolicyState
      parameters:
        - $ref: '#/components/parameters/world'
      responses:
        '200':
          description: Source-pinned domestic state
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json: { schema: { type: object } }
        '404': { description: Unavailable world }
  /worlds/{world}/domestic/summary:
    get:
      operationId: readDomesticPolicySummary
      parameters:
        - $ref: '#/components/parameters/world'
      responses:
        '200':
          description: Cumulative fictional fiscal flows and social indicators
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json: { schema: { type: object } }
        '404': { description: Unavailable world }
  /worlds/{world}/domestic/proposals:
    post:
      operationId: proposeDomesticPolicy
      parameters:
        - $ref: '#/components/parameters/world'
        - { name: If-Match, in: header, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 12, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [policy_id, effective_day]
              properties:
                policy_id: { $ref: '#/components/schemas/Identifier' }
                effective_day: { type: string, format: date }
      responses:
        '202': { description: Proposal recorded }
        '403': { description: Forbidden }
        '409': { description: State conflict }
        '412': { description: Stale ETag }
        '422': { description: Invalid request }
        '428': { description: Preconditions required }
  /worlds/{world}/domestic/enactments:
    post:
      operationId: authorizeDomesticEnactment
      parameters:
        - $ref: '#/components/parameters/world'
        - { name: If-Match, in: header, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 12, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [policy_id]
              properties:
                policy_id: { $ref: '#/components/schemas/Identifier' }
      responses:
        '200': { description: Verified simulated final act applied }
        '403': { description: Forbidden }
        '409': { description: Missing final act or state conflict }
        '412': { description: Stale ETag }
        '422': { description: Invalid request }
        '428': { description: Preconditions required }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Authentication gateway reserved; no production token verifier implemented.
  parameters:
    matterId:
      name: matterId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Identifier' }
    billId:
      name: billId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Identifier' }
    statementId:
      name: statementId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Identifier' }
    motionId:
      name: motionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Identifier' }
    policyId:
      name: policyId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Identifier' }
    organization:
      name: organization
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Identifier' }
    world:
      name: world
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Identifier' }
    country:
      name: country
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Z]{2}$' }
    idempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{12,100}$' }
      description: Actor- and world-scoped crash-safe receipt in the persistent store.
    ifMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
      description: Strong ETag precondition for state-changing commands.
  schemas:
    WorldClockState:
      type: object
      required: [world_id,committed_day,pending_day,status,revision,completed_subsystems,countries,completed_country_clocks,france_parliament_enabled,france_parliament_completed,coherent]
      properties:
        world_id: { $ref: '#/components/schemas/Identifier' }
        committed_day: { type: string, format: date }
        pending_day: { type: [string, 'null'], format: date }
        status: { type: string, enum: [coherent, advancing] }
        revision: { type: integer, minimum: 0 }
        completed_subsystems:
          type: array
          uniqueItems: true
          items: { type: string, enum: [organizations, diplomacy, economy, domestic, opinion] }
        countries:
          type: array
          uniqueItems: true
          description: Pinned country rulebook list for active national clocks.
          items: { type: string, pattern: '^[A-Z]{2}$' }
        completed_country_clocks:
          type: array
          uniqueItems: true
          description: National clocks already advanced during a pending tick.
          items: { type: string, pattern: '^[A-Z]{2}$' }
        france_parliament_enabled:
          type: boolean
          description: Whether the French constitutional day is a mandatory global-clock step.
        domestic_enabled: { type: boolean }
        opinion_enabled: { type: boolean }
        game_over: { type: boolean }
        campaign: { type: object, description: Optional terminal-aware campaign summary }
        france_parliament_completed:
          type: boolean
          description: Whether the French constitutional checkpoint is durable for this pending game day.
        coherent: { type: boolean }
    Identifier:
      type: string
      pattern: '^[a-z][a-z0-9_-]{0,63}$'
    GeopoliticalActorId:
      type: string
      pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'
    ProgrammeMeasure:
      type: object
      additionalProperties: false
      required: [id, domain, proposal, sources]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        domain: { $ref: '#/components/schemas/Identifier' }
        proposal: { type: string, minLength: 1, maxLength: 1000 }
        sources:
          type: array
          maxItems: 20
          items: { type: string, format: uri, pattern: '^https://' }
    Person:
      type: object
      additionalProperties: false
      required: [id, kind, name, country, biography, as_of, sources, programme]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        kind: { type: string, enum: [real, fictional] }
        name: { type: string, minLength: 1, maxLength: 160 }
        country: { type: string, pattern: '^[A-Z]{2}$' }
        biography: { type: string, maxLength: 2000 }
        as_of: { type: [string, 'null'], format: date }
        sources:
          type: array
          maxItems: 20
          items: { type: string, format: uri, pattern: '^https://' }
        programme:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/ProgrammeMeasure' }
        profile: { $ref: '#/components/schemas/CharacterProfile' }
        avatar: { type: string, const: generic-v1 }
    CharacterCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        name: { type: string, minLength: 1, maxLength: 160 }
        mode: { type: string, enum: [quick, detailed], default: quick }
        kind: { type: string, const: fictional }
        country: { type: string, pattern: '^[A-Z]{2}$' }
        biography: { type: string, maxLength: 2000, default: '' }
        avatar: { type: string, const: generic-v1 }
        profile: { $ref: '#/components/schemas/CharacterProfile' }
        programme:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [id, domain, proposal]
            properties:
              id: { $ref: '#/components/schemas/Identifier' }
              domain: { $ref: '#/components/schemas/Identifier' }
              proposal: { type: string, minLength: 1, maxLength: 1000 }
              sources: { type: array, maxItems: 0, default: [] }
    CharacterProfile:
      type: object
      additionalProperties: false
      properties:
        birth_date: { type: string, format: date }
        birth_place: { type: string, maxLength: 160 }
        personal_statement: { type: string, maxLength: 2000 }
        party: { type: string, maxLength: 160 }
        orientation: { type: string, maxLength: 160 }
        education: { $ref: '#/components/schemas/ProfileTextList' }
        languages: { $ref: '#/components/schemas/ProfileTextList' }
        professional_history: { $ref: '#/components/schemas/ProfileTextList' }
        public_service: { $ref: '#/components/schemas/ProfileTextList' }
        expertise: { $ref: '#/components/schemas/ProfileTextList' }
        political_history: { $ref: '#/components/schemas/ProfileTextList' }
        policy_priorities: { $ref: '#/components/schemas/ProfileTextList' }
    ProfileTextList:
      type: array
      maxItems: 24
      items: { type: string, maxLength: 300 }
    Problem:
      type: object
      required: [type, status, code]
      properties:
        type: { type: string }
        status: { type: integer }
        code: { type: string }
  responses:
    notFound:
      description: Missing or inaccessible resource
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    forbidden:
      description: Insufficient ability for the operation
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    conflict:
      description: Conflicting request or state
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    precondition:
      description: Missing or stale state precondition
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    invalid:
      description: Invalid request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    missingPrecondition:
      description: Idempotency key or If-Match was not supplied
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
