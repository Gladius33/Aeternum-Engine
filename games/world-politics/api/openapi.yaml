openapi: 3.1.0
info:
  title: World Politics Headless API
  version: 0.2.0-headless-prototype
  description: |
    Experimental, transport-neutral contract, not a deployed HTTP server.
    Do not expose until server-side authentication, MariaDB, durable receipts
    and authoritative world-role authorization have been implemented.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Politics
    description: World-scoped political identity and cabinet state
  - name: Diplomacy
    description: Headless persistent international actor interactions
  - name: Organizations
    description: Source-pinned multilateral membership and voting procedures
  - name: Economy
    description: Provenance-aware economic reference and hypothetical effects
  - name: WorldClock
    description: Authoritative resumable coordination of simulated world day
paths:
  /worlds/{world}/diplomacy:
    get:
      operationId: readWorldDiplomacy
      tags: [Diplomacy]
      summary: Read world-scoped diplomatic proposals, declarations and events
      parameters:
        - $ref: '#/components/parameters/world'
      responses:
        '200':
          description: Durable diplomatic state with strong ETag
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json: { schema: { type: object, additionalProperties: true } }
        '404': { $ref: '#/components/responses/notFound' }
  /worlds/{world}/diplomacy/actors:
    get:
      operationId: listDiplomaticActors
      tags: [Diplomacy]
      description: Source-pinned states and separate governing authorities; no playable AI-only actors.
      parameters:
        - $ref: '#/components/parameters/world'
      responses:
        '200':
          description: Dated actors and source dataset hash
          content:
            application/json: { schema: { type: object, additionalProperties: true } }
        '404': { $ref: '#/components/responses/notFound' }
  /worlds/{world}/diplomacy/proposals:
    get:
      operationId: listDiplomaticProposals
      tags: [Diplomacy]
      parameters:
        - $ref: '#/components/parameters/world'
      responses:
        '200':
          description: Proposals in persistent world state
          content:
            application/json: { schema: { type: object, additionalProperties: true } }
    post:
      operationId: offerDiplomaticCooperation
      tags: [Diplomacy]
      description: Creates an offer or fictional declaration; never automatically ratifies treaties.
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/idempotency'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [from, to, action]
              properties:
                from: { $ref: '#/components/schemas/GeopoliticalActorId' }
                to: { $ref: '#/components/schemas/GeopoliticalActorId' }
                action:
                  type: string
                  enum: [dialogue, humanitarian_assistance, trade_cooperation, treaty_proposal, express_support, express_opposition, sanctions_proposal]
      responses:
        '202':
          description: Offer stored with idempotent receipt and current ETag
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json: { schema: { type: object, additionalProperties: true } }
        '403': { $ref: '#/components/responses/forbidden' }
        '409': { $ref: '#/components/responses/conflict' }
        '412': { $ref: '#/components/responses/precondition' }
        '422': { $ref: '#/components/responses/invalid' }
        '428': { $ref: '#/components/responses/missingPrecondition' }
  /worlds/{world}/diplomacy/responses:
    post:
      operationId: respondToDiplomaticProposal
      tags: [Diplomacy]
      description: Response is a fictional acceptance in principle, not a binding international treaty.
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/idempotency'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [responder, proposal_id, accepted]
              properties:
                responder: { $ref: '#/components/schemas/GeopoliticalActorId' }
                proposal_id: { $ref: '#/components/schemas/Identifier' }
                accepted: { type: boolean }
      responses:
        '200': { description: Response recorded without binding treaty effect }
        '403': { $ref: '#/components/responses/forbidden' }
        '409': { $ref: '#/components/responses/conflict' }
        '412': { $ref: '#/components/responses/precondition' }
        '422': { $ref: '#/components/responses/invalid' }
        '428': { $ref: '#/components/responses/missingPrecondition' }
  /worlds/{world}/diplomacy/ai/decisions:
    post:
      operationId: runAutonomousDiplomaticPlanner
      tags: [Diplomacy]
      description: Trusted service actor only; never allow a human client to impersonate another country.
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/idempotency'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [responder, policy]
              properties:
                responder: { $ref: '#/components/schemas/GeopoliticalActorId' }
                policy: { type: string, enum: [cautious, open_dialogue, humanitarian_open] }
      responses:
        '200': { description: Autonomous choices recorded atomically }
        '403': { $ref: '#/components/responses/forbidden' }
        '409': { $ref: '#/components/responses/conflict' }
        '412': { $ref: '#/components/responses/precondition' }
        '422': { $ref: '#/components/responses/invalid' }
        '428': { $ref: '#/components/responses/missingPrecondition' }
  /worlds/{world}/diplomacy/clock:
    post:
      operationId: advanceWorldDiplomaticClock
      tags: [Diplomacy]
      description: Server worker-only virtual clock; progresses expiring proposals.
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/idempotency'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [target_day]
              properties:
                target_day: { type: string, format: date }
      responses:
        '200': { description: Time advanced and due events stored }
        '403': { $ref: '#/components/responses/forbidden' }
        '409': { $ref: '#/components/responses/conflict' }
        '412': { $ref: '#/components/responses/precondition' }
        '422': { $ref: '#/components/responses/invalid' }
        '428': { $ref: '#/components/responses/missingPrecondition' }
  /worlds/{world}/countries/{country}/institutions:
    get:
      operationId: readCountryInstitutionalState
      summary: Read game-state of a specific country's institutions
      description: No generic global presidential power exists. World access is checked by the trusted server.
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/country'
      responses:
        '200':
          description: Version-pinned institutional state with ETag
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '404': { $ref: '#/components/responses/notFound' }
  /worlds/{world}/countries/{country}/institutions/rulebook:
    get:
      operationId: readCountryConstitutionalRulebook
      summary: Inspect a country's reviewed partial constitutional rules
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/country'
      responses:
        '200':
          description: Country-specific reviewed legal citations and supported actions (pilot; not exhaustive)
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '404': { $ref: '#/components/responses/notFound' }
  /worlds/{world}/countries/{country}/institutions/decisions:
    post:
      operationId: proposeInstitutionalDecision
      summary: Submit an authorized country-specific institutional action
      description: |
        Role is resolved exclusively by trusted server-side office authority.
        Clients cannot declare president, prime minister or parliamentary role.
        Legal conditions are checked against recorded world events.
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/country'
        - $ref: '#/components/parameters/idempotency'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, payload]
              properties:
                action:
                  type: string
                  enum: [record_consultation, submit_bill, dissolve_lower_house, hold_election]
                payload:
                  type: object
                  additionalProperties: true
                  description: Validated against the chosen country's specific action schema
      responses:
        '202':
          description: Command journaled; may create delayed game-time events
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '403': { $ref: '#/components/responses/forbidden' }
        '409': { $ref: '#/components/responses/conflict' }
        '412': { $ref: '#/components/responses/precondition' }
        '422': { $ref: '#/components/responses/invalid' }
  /worlds/{world}/countries/{country}/institutions/clock:
    post:
      operationId: advanceInstitutionalGameClock
      summary: Privileged simulation clock operation; never a public player permission
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/country'
        - $ref: '#/components/parameters/idempotency'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [target_day]
              properties:
                target_day: { type: string, format: date }
      responses:
        '200':
          description: Due world events processed deterministically, with a durable receipt
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '403': { $ref: '#/components/responses/forbidden' }
        '409': { $ref: '#/components/responses/conflict' }
        '412': { $ref: '#/components/responses/precondition' }
        '422': { $ref: '#/components/responses/invalid' }
  /worlds/{world}/countries/{country}/politics:
    get:
      operationId: readNationalPolitics
      tags: [Politics]
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/country'
      responses:
        '200':
          description: World-scoped political roster and cabinet
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '404':
          $ref: '#/components/responses/notFound'
  /worlds/{world}/countries/{country}/politics/person-template:
    get:
      operationId: readCharacterFormTemplate
      tags: [Politics]
      description: >
        Backend-only schema metadata for both quick and detailed character
        entry; clients choose how to render it. No graphic elements are served.
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/country'
      responses:
        '200':
          description: Versioned field groups, requirements and generic avatar marker
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, avatar, modes, sections, fields]
                properties:
                  schema_version: { type: string }
                  avatar: { type: object, additionalProperties: true }
                  modes: { type: object, additionalProperties: true }
                  sections: { type: array, items: { type: object, additionalProperties: true } }
                  fields: { type: object, additionalProperties: true }
        '404':
          $ref: '#/components/responses/notFound'
  /worlds/{world}/countries/{country}/politics/people/{personId}:
    get:
      operationId: readPoliticalPerson
      tags: [Politics]
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/country'
        - name: personId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Identifier' }
      responses:
        '200':
          description: Single source-attributed or fictional political person
          content:
            application/json:
              schema:
                type: object
                required: [person]
                properties:
                  person: { $ref: '#/components/schemas/Person' }
        '404':
          $ref: '#/components/responses/notFound'
  /worlds/{world}/countries/{country}/politics/people:
    post:
      operationId: createFictionalPoliticalPerson
      tags: [Politics]
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/country'
        - $ref: '#/components/parameters/idempotency'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CharacterCreate' }
      responses:
        '201':
          description: Fictional person created in the scenario
          content:
            application/json:
              schema:
                type: object
                required: [person_id]
                properties:
                  person_id: { $ref: '#/components/schemas/Identifier' }
        '403': { $ref: '#/components/responses/forbidden' }
        '409': { $ref: '#/components/responses/conflict' }
        '412': { $ref: '#/components/responses/precondition' }
        '422': { $ref: '#/components/responses/invalid' }
  /worlds/{world}/countries/{country}/politics/head-of-state:
    post:
      operationId: initializeAlternatePresidency
      tags: [Politics]
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/country'
        - $ref: '#/components/parameters/idempotency'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [person_id]
              properties:
                person_id: { $ref: '#/components/schemas/Identifier' }
      responses:
        '200':
          description: Alternate scenario head of state initialized
        '403': { $ref: '#/components/responses/forbidden' }
        '409': { $ref: '#/components/responses/conflict' }
        '412': { $ref: '#/components/responses/precondition' }
        '422': { $ref: '#/components/responses/invalid' }
  /worlds/{world}/countries/{country}/politics/nominations:
    post:
      operationId: proposePoliticalNomination
      tags: [Politics]
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/country'
        - $ref: '#/components/parameters/idempotency'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [office, person_id]
              properties:
                office: { $ref: '#/components/schemas/Identifier' }
                person_id: { $ref: '#/components/schemas/Identifier' }
      responses:
        '202':
          description: Proposal registered but no automatic appointment
        '403': { $ref: '#/components/responses/forbidden' }
        '409': { $ref: '#/components/responses/conflict' }
        '412': { $ref: '#/components/responses/precondition' }
        '422': { $ref: '#/components/responses/invalid' }
  /worlds/{world}/countries/{country}/politics/nominations/{office}/resolution:
    post:
      operationId: resolvePoliticalNomination
      tags: [Politics]
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/country'
        - $ref: '#/components/parameters/idempotency'
        - $ref: '#/components/parameters/ifMatch'
        - name: office
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Identifier' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [accepted]
              properties:
                accepted: { type: boolean }
      responses:
        '200':
          description: Proposal accepted or declined by an authorized simulation actor
        '403': { $ref: '#/components/responses/forbidden' }
        '409': { $ref: '#/components/responses/conflict' }
        '412': { $ref: '#/components/responses/precondition' }
        '422': { $ref: '#/components/responses/invalid' }
  /worlds/{world}/organizations:
    get:
      tags: [Organizations]
      operationId: listWorldOrganizations
      description: Read source-pinned charter definitions and current memberships.
      parameters:
        - $ref: '#/components/parameters/world'
      responses:
        '200':
          description: Fictional or carefully curated international organizations
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '404': { $ref: '#/components/responses/notFound' }
  /worlds/{world}/organizations/{organization}:
    get:
      tags: [Organizations]
      operationId: readWorldOrganization
      description: Read the current membership, applications and withdrawal notices.
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/organization'
      responses:
        '200':
          description: Organization with membership history
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '404': { $ref: '#/components/responses/notFound' }
  /worlds/{world}/organizations/{organization}/applications:
    post:
      tags: [Organizations]
      operationId: requestOrganizationMembership
      description: A membership application is a request, not immediate accession.
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/organization'
        - $ref: '#/components/parameters/idempotency'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [applicant]
              properties:
                applicant: { $ref: '#/components/schemas/GeopoliticalActorId' }
      responses:
        '202': { description: Membership application opened for member-state vote }
        '403': { $ref: '#/components/responses/forbidden' }
        '409': { $ref: '#/components/responses/conflict' }
        '412': { $ref: '#/components/responses/precondition' }
        '422': { $ref: '#/components/responses/invalid' }
        '428': { $ref: '#/components/responses/missingPrecondition' }
  /worlds/{world}/organizations/{organization}/votes:
    post:
      tags: [Organizations]
      operationId: voteOnOrganizationMembership
      description: Authorized state vote; votes by AI-only states require trusted AI identity.
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/organization'
        - $ref: '#/components/parameters/idempotency'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [voter, application_id, approve]
              properties:
                voter: { $ref: '#/components/schemas/GeopoliticalActorId' }
                application_id: { $ref: '#/components/schemas/Identifier' }
                approve: { type: boolean }
      responses:
        '200': { description: Vote recorded without immediate treaty accession }
        '403': { $ref: '#/components/responses/forbidden' }
        '409': { $ref: '#/components/responses/conflict' }
        '412': { $ref: '#/components/responses/precondition' }
        '422': { $ref: '#/components/responses/invalid' }
        '428': { $ref: '#/components/responses/missingPrecondition' }
  /worlds/{world}/organizations/{organization}/formalizations:
    post:
      tags: [Organizations]
      operationId: formalizeOrganizationMembership
      description: Trusted service only; approval threshold and ratification delay must be satisfied.
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/organization'
        - $ref: '#/components/parameters/idempotency'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [application_id]
              properties:
                application_id: { $ref: '#/components/schemas/Identifier' }
      responses:
        '200': { description: Membership formally entered into world state }
        '403': { $ref: '#/components/responses/forbidden' }
        '409': { $ref: '#/components/responses/conflict' }
        '412': { $ref: '#/components/responses/precondition' }
        '422': { $ref: '#/components/responses/invalid' }
        '428': { $ref: '#/components/responses/missingPrecondition' }
  /worlds/{world}/organizations/{organization}/withdrawals:
    post:
      tags: [Organizations]
      operationId: requestOrganizationWithdrawal
      description: Withdrawal takes effect only after the organization-specific notice.
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/organization'
        - $ref: '#/components/parameters/idempotency'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [actor]
              properties:
                actor: { $ref: '#/components/schemas/GeopoliticalActorId' }
      responses:
        '202': { description: Withdrawal notice accepted but membership remains active }
        '403': { $ref: '#/components/responses/forbidden' }
        '409': { $ref: '#/components/responses/conflict' }
        '412': { $ref: '#/components/responses/precondition' }
        '422': { $ref: '#/components/responses/invalid' }
        '428': { $ref: '#/components/responses/missingPrecondition' }
  /worlds/{world}/organizations/clock:
    post:
      tags: [Organizations]
      operationId: advanceOrganizationWorldClock
      description: Trusted simulation service only; applies due withdrawal notices.
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/idempotency'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [target_day]
              properties:
                target_day: { type: string, format: date }
      responses:
        '200': { description: Game clock advanced and due notices handled }
        '403': { $ref: '#/components/responses/forbidden' }
        '409': { $ref: '#/components/responses/conflict' }
        '412': { $ref: '#/components/responses/precondition' }
        '422': { $ref: '#/components/responses/invalid' }
        '428': { $ref: '#/components/responses/missingPrecondition' }

  /worlds/{world}/organizations/ai/decisions:
    post:
      tags: [Organizations]
      operationId: executeAutonomousOrganizationVotes
      description: >
        Trusted non-player service principal only. A configurable fictional
        scenario policy evaluates open votes. It never represents the
        documented intentions of a real government and cannot ratify membership.
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/idempotency'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [voter, policy]
              properties:
                voter: { $ref: '#/components/schemas/GeopoliticalActorId' }
                policy:
                  type: string
                  enum: [cautious, cooperative, consensus_seeking]
      responses:
        '200':
          description: NPC voting decisions admitted by the same transaction gate as player votes
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json: { schema: { type: object, additionalProperties: true } }
        '403': { $ref: '#/components/responses/forbidden' }
        '409': { $ref: '#/components/responses/conflict' }
        '412': { $ref: '#/components/responses/precondition' }
        '422': { $ref: '#/components/responses/invalid' }
        '428': { $ref: '#/components/responses/missingPrecondition' }

  /worlds/{world}/economy:
    get:
      operationId: readWorldEconomy
      tags: [Economy]
      description: >
        Read pinned scenario policies and modeled hypothetical consequences.
        GDP and other official published reference values are never mutated.
      parameters:
        - $ref: '#/components/parameters/world'
      responses:
        '200':
          description: Economic world scenario snapshot with strong ETag
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json: { schema: { type: object, additionalProperties: true } }
        '404': { $ref: '#/components/responses/notFound' }
  /worlds/{world}/economy/indicators:
    get:
      operationId: readWorldEconomicReferenceIndicators
      tags: [Economy]
      description: >
        Dated indicators with explicit observed, scenario_assumption or missing
        provenance; redistribution rights must be checked by data curators.
      parameters:
        - $ref: '#/components/parameters/world'
      responses:
        '200':
          description: Source-attributed pinned economic reference data
          content:
            application/json: { schema: { type: object, additionalProperties: true } }
        '404': { $ref: '#/components/responses/notFound' }
  /worlds/{world}/economy/policies:
    post:
      operationId: proposeWorldTradeRestriction
      tags: [Economy]
      description: >
        Proposal only. No automatic sanctions, trade change or GDP forecast.
        Percentages are scenario-author assumptions, not historical outcomes.
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/idempotency'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [from, to, effect_bps, low_bps, high_bps, effective_on]
              properties:
                from: { $ref: '#/components/schemas/GeopoliticalActorId' }
                to: { $ref: '#/components/schemas/GeopoliticalActorId' }
                effect_bps: { type: integer, minimum: 0, maximum: 10000 }
                low_bps: { type: integer, minimum: 0, maximum: 10000 }
                high_bps: { type: integer, minimum: 0, maximum: 10000 }
                effective_on: { type: string, format: date }
      responses:
        '202': { description: Nonbinding policy proposal recorded }
        '403': { $ref: '#/components/responses/forbidden' }
        '409': { $ref: '#/components/responses/conflict' }
        '412': { $ref: '#/components/responses/precondition' }
        '422': { $ref: '#/components/responses/invalid' }
        '428': { $ref: '#/components/responses/missingPrecondition' }
  /worlds/{world}/economy/policies/{policyId}:
    get:
      operationId: readWorldEconomicPolicy
      tags: [Economy]
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/policyId'
      responses:
        '200':
          description: Policy lifecycle with null or explicit scenario projection
          content:
            application/json: { schema: { type: object, additionalProperties: true } }
        '404': { $ref: '#/components/responses/notFound' }
  /worlds/{world}/economy/policies/{policyId}/authorization:
    post:
      operationId: authorizeWorldEconomicPolicy
      tags: [Economy]
      description: >
        Country-specific lawful process verified by trusted server-side
        institutional authority; never by a Boolean from request JSON.
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/policyId'
        - $ref: '#/components/parameters/idempotency'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
      responses:
        '200': { description: Procedure authorized; effect still pending virtual date }
        '403': { $ref: '#/components/responses/forbidden' }
        '409': { $ref: '#/components/responses/conflict' }
        '412': { $ref: '#/components/responses/precondition' }
        '422': { $ref: '#/components/responses/invalid' }
        '428': { $ref: '#/components/responses/missingPrecondition' }
  /worlds/{world}/economy/clock:
    post:
      operationId: advanceWorldEconomicClock
      tags: [Economy]
      description: >
        Trusted simulation scheduler only. Computes synthetic policy
        projections without changing observed reference indicators.
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/idempotency'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [target_day]
              properties:
                target_day: { type: string, format: date }
      responses:
        '200': { description: Virtual clock advanced and due approved policies applied }
        '403': { $ref: '#/components/responses/forbidden' }
        '409': { $ref: '#/components/responses/conflict' }
        '412': { $ref: '#/components/responses/precondition' }
        '422': { $ref: '#/components/responses/invalid' }
        '428': { $ref: '#/components/responses/missingPrecondition' }

  /worlds/{world}/clock:
    get:
      operationId: readAuthoritativeWorldClock
      tags: [WorldClock]
      description: >
        Read committed date and any pending cross-domain advance. A pending
        tick is NOT presented as a coherent new game day. Privileged verified
        server identity required in this experimental adapter.
      parameters:
        - $ref: '#/components/parameters/world'
      responses:
        '200':
          description: Coherent or advancing world day and strong ETag
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorldClockState' }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }
  /worlds/{world}/clock/advances:
    post:
      operationId: advanceAuthoritativeWorldClock
      tags: [WorldClock]
      description: >
        Trusted server-only clock tick. Advances organizations, diplomacy and
        economic aggregates through separately committed idempotent commands.
        The persistent pending intent is resumed after a crash; the final
        committed_day changes only when all three aggregates reach target.
        A single tick is limited to 366 game days. National institutions
        and cross-domain policy resolution require later integration.
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/idempotency'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [target_day]
              properties:
                target_day: { type: string, format: date }
      responses:
        '200':
          description: All three world domain clocks coherently advanced
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '403': { $ref: '#/components/responses/forbidden' }
        '404': { $ref: '#/components/responses/notFound' }
        '409': { $ref: '#/components/responses/conflict' }
        '412': { $ref: '#/components/responses/precondition' }
        '422': { $ref: '#/components/responses/invalid' }
        '428': { $ref: '#/components/responses/missingPrecondition' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Authentication gateway reserved; no production token verifier implemented.
  parameters:
    policyId:
      name: policyId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Identifier' }
    organization:
      name: organization
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Identifier' }
    world:
      name: world
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Identifier' }
    country:
      name: country
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Z]{2}$' }
    idempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{12,100}$' }
      description: Actor- and world-scoped crash-safe receipt in the persistent store.
    ifMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
      description: Strong ETag precondition for state-changing commands.
  schemas:
    WorldClockState:
      type: object
      required: [world_id,committed_day,pending_day,status,revision,completed_subsystems,coherent]
      properties:
        world_id: { $ref: '#/components/schemas/Identifier' }
        committed_day: { type: string, format: date }
        pending_day: { type: [string, 'null'], format: date }
        status: { type: string, enum: [coherent, advancing] }
        revision: { type: integer, minimum: 0 }
        completed_subsystems:
          type: array
          uniqueItems: true
          items: { type: string, enum: [organizations, diplomacy, economy] }
        coherent: { type: boolean }
    Identifier:
      type: string
      pattern: '^[a-z][a-z0-9_-]{0,63}$'
    GeopoliticalActorId:
      type: string
      pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'
    ProgrammeMeasure:
      type: object
      additionalProperties: false
      required: [id, domain, proposal, sources]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        domain: { $ref: '#/components/schemas/Identifier' }
        proposal: { type: string, minLength: 1, maxLength: 1000 }
        sources:
          type: array
          maxItems: 20
          items: { type: string, format: uri, pattern: '^https://' }
    Person:
      type: object
      additionalProperties: false
      required: [id, kind, name, country, biography, as_of, sources, programme]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        kind: { type: string, enum: [real, fictional] }
        name: { type: string, minLength: 1, maxLength: 160 }
        country: { type: string, pattern: '^[A-Z]{2}$' }
        biography: { type: string, maxLength: 2000 }
        as_of: { type: [string, 'null'], format: date }
        sources:
          type: array
          maxItems: 20
          items: { type: string, format: uri, pattern: '^https://' }
        programme:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/ProgrammeMeasure' }
        profile: { $ref: '#/components/schemas/CharacterProfile' }
        avatar: { type: string, const: generic-v1 }
    CharacterCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        name: { type: string, minLength: 1, maxLength: 160 }
        mode: { type: string, enum: [quick, detailed], default: quick }
        kind: { type: string, const: fictional }
        country: { type: string, pattern: '^[A-Z]{2}$' }
        biography: { type: string, maxLength: 2000, default: '' }
        avatar: { type: string, const: generic-v1 }
        profile: { $ref: '#/components/schemas/CharacterProfile' }
        programme:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [id, domain, proposal]
            properties:
              id: { $ref: '#/components/schemas/Identifier' }
              domain: { $ref: '#/components/schemas/Identifier' }
              proposal: { type: string, minLength: 1, maxLength: 1000 }
              sources: { type: array, maxItems: 0, default: [] }
    CharacterProfile:
      type: object
      additionalProperties: false
      properties:
        birth_date: { type: string, format: date }
        birth_place: { type: string, maxLength: 160 }
        personal_statement: { type: string, maxLength: 2000 }
        party: { type: string, maxLength: 160 }
        orientation: { type: string, maxLength: 160 }
        education: { $ref: '#/components/schemas/ProfileTextList' }
        languages: { $ref: '#/components/schemas/ProfileTextList' }
        professional_history: { $ref: '#/components/schemas/ProfileTextList' }
        public_service: { $ref: '#/components/schemas/ProfileTextList' }
        expertise: { $ref: '#/components/schemas/ProfileTextList' }
        political_history: { $ref: '#/components/schemas/ProfileTextList' }
        policy_priorities: { $ref: '#/components/schemas/ProfileTextList' }
    ProfileTextList:
      type: array
      maxItems: 24
      items: { type: string, maxLength: 300 }
    Problem:
      type: object
      required: [type, status, code]
      properties:
        type: { type: string }
        status: { type: integer }
        code: { type: string }
  responses:
    notFound:
      description: Missing or inaccessible resource
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    forbidden:
      description: Insufficient ability for the operation
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    conflict:
      description: Conflicting request or state
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    precondition:
      description: Missing or stale state precondition
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    invalid:
      description: Invalid request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    missingPrecondition:
      description: Idempotency key or If-Match was not supplied
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
