openapi: 3.1.0
info:
  title: World Politics Headless API
  version: 0.2.0-headless-prototype
  description: |
    Experimental contract; WP30 mounts a private alpha subset only.
    Other paths remain transport-neutral and are not exposed by the alpha gateway.
    Do not expose until server-side authentication, MariaDB, durable receipts
    and authoritative world-role authorization have been implemented.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Politics
    description: World-scoped political identity and cabinet state
  - name: Diplomacy
    description: Headless persistent international actor interactions
  - name: Organizations
    description: Source-pinned multilateral membership and voting procedures
  - name: Economy
    description: Provenance-aware economic reference and hypothetical effects
  - name: WorldClock
    description: Authoritative resumable coordination of simulated world day
  - name: FrenchConstitution
    description: France Article 49(3), parliamentary censure and Article 50, modelled separately from regime collapse
  - name: FrenchSociety
    description: Versioned professional and regional social scenario outputs, never official forecasts
  - name: FrenchParliamentCalendar
    description: Source-labelled Assembly sitting dates and authenticated censure hearing schedules
  - name: FrenchAssembly
    description: Authenticated deputy-by-deputy votes and fictional parliamentary coalitions
paths:
  /worlds/{world}/campaign:
    get:
      operationId: readCampaignLifecycle
      summary: Read fictional player mandate and terminal outcome
      parameters:
        - $ref: '#/components/parameters/world'
      responses:
        '200':
          description: Current or terminal archived campaign
          content:
            application/json:
              schema:
                type: object
                required: [world_id, status, office_retained, regime_changed]
                properties:
                  world_id: { type: string }
                  status: { type: string, enum: [active, game_over] }
                  office_retained: { type: boolean }
                  regime_changed: { type: boolean }
                  ended_on: { type: [string, 'null'], format: date }
                  reason: { type: [string, 'null'] }
        '404': { description: Inaccessible world or unsupported scenario }
        '409': { description: World advancing }
  /worlds/{world}/countries/FR/dialogue:
    get:
      operationId: readFrenchCivicDialogue
      summary: Read fictional civic associations and dialogue status
      parameters:
        - $ref: '#/components/parameters/world'
      responses:
        '200': { description: Scenario-only dialogue and abstract continuity indices }
        '404': { description: Inaccessible world or unsupported scenario }
        '409': { description: World advancing }
  /worlds/{world}/countries/FR/opinion:
    get:
      operationId: readFrenchScenarioOpinion
      summary: Read fictional aggregate opinion and source-attributed daily history
      parameters:
        - $ref: '#/components/parameters/world'
      responses:
        '200': { description: Fictional opinion indices and daily history }
        '404': { description: Inaccessible world or unsupported scenario }
        '409': { description: World advancing }
  /health:
    get:
      security: []
      responses:
        '200': { description: Private alpha transport health }
  /accounts:
    post:
      security: []
      summary: Private invite-gated account enrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password, invite]
              properties:
                username: { type: string, minLength: 3, maxLength: 32 }
                password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
                invite: { type: string, writeOnly: true }
      responses:
        '201': { description: Account created }
        '403': { description: Enrollment denied }
        '409': { description: Account unavailable }
        '429': { description: Rate limited }
  /sessions:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, writeOnly: true }
      responses:
        '200': { description: Expiring opaque bearer token }
        '401': { description: Invalid credentials }
        '429': { description: Rate limited }
  /session:
    delete:
      responses:
        '200': { description: Current token revoked }
        '401': { description: Authentication required }
  /me:
    get:
      responses:
        '200': { description: Authenticated account identity }
        '401': { description: Authentication required }
  /scenarios:
    get:
      operationId: listAlphaScenarios
      responses:
        '200': { description: Supported scenario versions and reference coverage }
        '401': { description: Authentication required }
  /worlds/{world}/references:
    get:
      operationId: readPinnedWorldReferences
      parameters:
        - $ref: '#/components/parameters/world'
      responses:
        '200': { description: Pinned country catalog and economic provenance coverage }
        '404': { description: Inaccessible world or unsupported scenario }
  /worlds:
    get:
      responses:
        '200': { description: Accessible durable worlds }
        '401': { description: Authentication required }
    post:
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 12, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [label, scenario]
              properties:
                label: { type: string, maxLength: 100 }
                scenario: { type: string, enum: [fr-sandbox-v1, fr-global-v1, fr-comparative-v1, fr-electoral-v1, fr-political-v1, fr-opinion-v1, fr-dialogue-v1, fr-survival-v1, fr-revolution-case-v1] }
                reference_bundle_sha: { type: string, pattern: '^[a-f0-9]{64}$', description: Optional operator-installed reference bundle for global or comparative scenarios }
      responses:
        '201': { description: Atomically created or replayed private world }
        '409': { description: World quota or idempotency conflict }
        '428': { description: Missing idempotency key }
  /worlds/{world}/members:
    post:
      parameters:
        - $ref: '#/components/parameters/world'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [account_id, access]
              properties:
                account_id: { type: string, pattern: '^acct-[a-f0-9]{32}$' }
                access: { type: string, enum: [viewer, none] }
      responses:
        '200': { description: Viewer granted or revoked }
        '403': { description: Owner required }
        '404': { description: Inaccessible world }
  /worlds/{world}/diplomacy:
    get:
      operationId: readWorldDiplomacy
      tags: [Diplomacy]
      summary: Read world-scoped diplomatic proposals, declarations and events
      parameters:
        - $ref: '#/components/parameters/world'
      responses:
        '200':
          description: Durable diplomatic state with strong ETag
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json: { schema: { type: object, additionalProperties: true } }
        '404': { $ref: '#/components/responses/notFound' }
  /worlds/{world}/diplomacy/actors:
    get:
      operationId: listDiplomaticActors
      tags: [Diplomacy]
      description: Source-pinned states and separate governing authorities; no playable AI-only actors.
      parameters:
        - $ref: '#/components/parameters/world'
      responses:
        '200':
          description: Dated actors and source dataset hash
          content:
            application/json: { schema: { type: object, additionalProperties: true } }
        '404': { $ref: '#/components/responses/notFound' }
  /worlds/{world}/diplomacy/proposals:
    get:
      operationId: listDiplomaticProposals
      tags: [Diplomacy]
      parameters:
        - $ref: '#/components/parameters/world'
      responses:
        '200':
          description: Proposals in persistent world state
          content:
            application/json: { schema: { type: object, additionalProperties: true } }
    post:
      operationId: offerDiplomaticCooperation
      tags: [Diplomacy]
      description: Creates an offer or fictional declaration; never automatically ratifies treaties.
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/idempotency'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [from, to, action]
              properties:
                from: { $ref: '#/components/schemas/GeopoliticalActorId' }
                to: { $ref: '#/components/schemas/GeopoliticalActorId' }
                action:
                  type: string
                  enum: [dialogue, humanitarian_assistance, trade_cooperation, treaty_proposal, express_support, express_opposition, sanctions_proposal]
      responses:
        '202':
          description: Offer stored with idempotent receipt and current ETag
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json: { schema: { type: object, additionalProperties: true } }
        '403': { $ref: '#/components/responses/forbidden' }
        '409': { $ref: '#/components/responses/conflict' }
        '412': { $ref: '#/components/responses/precondition' }
        '422': { $ref: '#/components/responses/invalid' }
        '428': { $ref: '#/components/responses/missingPrecondition' }
  /worlds/{world}/diplomacy/responses:
    post:
      operationId: respondToDiplomaticProposal
      tags: [Diplomacy]
      description: Response is a fictional acceptance in principle, not a binding international treaty.
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/idempotency'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [responder, proposal_id, accepted]
              properties:
                responder: { $ref: '#/components/schemas/GeopoliticalActorId' }
                proposal_id: { $ref: '#/components/schemas/Identifier' }
                accepted: { type: boolean }
      responses:
        '200': { description: Response recorded without binding treaty effect }
        '403': { $ref: '#/components/responses/forbidden' }
        '409': { $ref: '#/components/responses/conflict' }
        '412': { $ref: '#/components/responses/precondition' }
        '422': { $ref: '#/components/responses/invalid' }
        '428': { $ref: '#/components/responses/missingPrecondition' }
  /worlds/{world}/diplomacy/ai/decisions:
    post:
      operationId: runAutonomousDiplomaticPlanner
      tags: [Diplomacy]
      description: Trusted service actor only; never allow a human client to impersonate another country.
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/idempotency'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [responder, policy]
              properties:
                responder: { $ref: '#/components/schemas/GeopoliticalActorId' }
                policy: { type: string, enum: [cautious, open_dialogue, humanitarian_open] }
      responses:
        '200': { description: Autonomous choices recorded atomically }
        '403': { $ref: '#/components/responses/forbidden' }
        '409': { $ref: '#/components/responses/conflict' }
        '412': { $ref: '#/components/responses/precondition' }
        '422': { $ref: '#/components/responses/invalid' }
        '428': { $ref: '#/components/responses/missingPrecondition' }
  /worlds/{world}/diplomacy/clock:
    post:
      operationId: advanceWorldDiplomaticClock
      tags: [Diplomacy]
      description: Server worker-only virtual clock; progresses expiring proposals.
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/idempotency'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [target_day]
              properties:
                target_day: { type: string, format: date }
      responses:
        '200': { description: Time advanced and due events stored }
        '403': { $ref: '#/components/responses/forbidden' }
        '409': { $ref: '#/components/responses/conflict' }
        '412': { $ref: '#/components/responses/precondition' }
        '422': { $ref: '#/components/responses/invalid' }
        '428': { $ref: '#/components/responses/missingPrecondition' }
  /worlds/{world}/countries/{country}/institutions:
    get:
      operationId: readCountryInstitutionalState
      summary: Read game-state of a specific country's institutions
      description: No generic global presidential power exists. World access is checked by the trusted server.
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/country'
      responses:
        '200':
          description: Version-pinned institutional state with ETag
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '404': { $ref: '#/components/responses/notFound' }
  /worlds/{world}/countries/{country}/institutions/rulebook:
    get:
      operationId: readCountryConstitutionalRulebook
      summary: Inspect a country's reviewed partial constitutional rules
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/country'
      responses:
        '200':
          description: Country-specific reviewed legal citations and supported actions (pilot; not exhaustive)
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '404': { $ref: '#/components/responses/notFound' }
  /worlds/{world}/countries/{country}/institutions/decisions:
    post:
      operationId: proposeInstitutionalDecision
      summary: Submit an authorized country-specific institutional action
      description: |
        Role is resolved exclusively by trusted server-side office authority.
        Clients cannot declare president, prime minister or parliamentary role.
        Legal conditions are checked against recorded world events.
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/country'
        - $ref: '#/components/parameters/idempotency'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, payload]
              properties:
                action:
                  type: string
                  enum: [record_consultation, submit_bill, dissolve_lower_house, hold_election, electoral_coalition]
                payload:
                  type: object
                  additionalProperties: true
                  description: Validated against the chosen country's specific action schema
      responses:
        '202':
          description: Command journaled; may create delayed game-time events
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '403': { $ref: '#/components/responses/forbidden' }
        '409': { $ref: '#/components/responses/conflict' }
        '412': { $ref: '#/components/responses/precondition' }
        '422': { $ref: '#/components/responses/invalid' }
  /worlds/{world}/countries/{country}/institutions/clock:
    post:
      operationId: advanceInstitutionalGameClock
      summary: Privileged simulation clock operation; never a public player permission
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/country'
        - $ref: '#/components/parameters/idempotency'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [target_day]
              properties:
                target_day: { type: string, format: date }
      responses:
        '200':
          description: Due world events processed deterministically, with a durable receipt
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '403': { $ref: '#/components/responses/forbidden' }
        '409': { $ref: '#/components/responses/conflict' }
        '412': { $ref: '#/components/responses/precondition' }
        '422': { $ref: '#/components/responses/invalid' }
  /worlds/{world}/countries/{country}/politics:
    get:
      operationId: readNationalPolitics
      tags: [Politics]
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/country'
      responses:
        '200':
          description: World-scoped political roster and cabinet
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '404':
          $ref: '#/components/responses/notFound'
  /worlds/{world}/countries/{country}/politics/person-template:
    get:
      operationId: readCharacterFormTemplate
      tags: [Politics]
      description: >
        Backend-only schema metadata for both quick and detailed character
        entry; clients choose how to render it. No graphic elements are served.
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/country'
      responses:
        '200':
          description: Versioned field groups, requirements and generic avatar marker
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, avatar, modes, sections, fields]
                properties:
                  schema_version: { type: string }
                  avatar: { type: object, additionalProperties: true }
                  modes: { type: object, additionalProperties: true }
                  sections: { type: array, items: { type: object, additionalProperties: true } }
                  fields: { type: object, additionalProperties: true }
        '404':
          $ref: '#/components/responses/notFound'
  /worlds/{world}/countries/{country}/politics/people/{personId}:
    get:
      operationId: readPoliticalPerson
      tags: [Politics]
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/country'
        - name: personId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Identifier' }
      responses:
        '200':
          description: Single source-attributed or fictional political person
          content:
            application/json:
              schema:
                type: object
                required: [person]
                properties:
                  person: { $ref: '#/components/schemas/Person' }
        '404':
          $ref: '#/components/responses/notFound'
  /worlds/{world}/countries/{country}/politics/people:
    post:
      operationId: createFictionalPoliticalPerson
      tags: [Politics]
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/country'
        - $ref: '#/components/parameters/idempotency'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CharacterCreate' }
      responses:
        '201':
          description: Fictional person created in the scenario
          content:
            application/json:
              schema:
                type: object
                required: [person_id]
                properties:
                  person_id: { $ref: '#/components/schemas/Identifier' }
        '403': { $ref: '#/components/responses/forbidden' }
        '409': { $ref: '#/components/responses/conflict' }
        '412': { $ref: '#/components/responses/precondition' }
        '422': { $ref: '#/components/responses/invalid' }
  /worlds/{world}/countries/{country}/politics/head-of-state:
    post:
      operationId: initializeAlternatePresidency
      tags: [Politics]
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/country'
        - $ref: '#/components/parameters/idempotency'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [person_id]
              properties:
                person_id: { $ref: '#/components/schemas/Identifier' }
      responses:
        '200':
          description: Alternate scenario head of state initialized
        '403': { $ref: '#/components/responses/forbidden' }
        '409': { $ref: '#/components/responses/conflict' }
        '412': { $ref: '#/components/responses/precondition' }
        '422': { $ref: '#/components/responses/invalid' }
  /worlds/{world}/countries/{country}/politics/nominations:
    post:
      operationId: proposePoliticalNomination
      tags: [Politics]
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/country'
        - $ref: '#/components/parameters/idempotency'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [office, person_id]
              properties:
                office: { $ref: '#/components/schemas/Identifier' }
                person_id: { $ref: '#/components/schemas/Identifier' }
      responses:
        '202':
          description: Proposal registered but no automatic appointment
        '403': { $ref: '#/components/responses/forbidden' }
        '409': { $ref: '#/components/responses/conflict' }
        '412': { $ref: '#/components/responses/precondition' }
        '422': { $ref: '#/components/responses/invalid' }
  /worlds/{world}/countries/{country}/politics/nominations/{office}/resolution:
    post:
      operationId: resolvePoliticalNomination
      tags: [Politics]
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/country'
        - $ref: '#/components/parameters/idempotency'
        - $ref: '#/components/parameters/ifMatch'
        - name: office
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Identifier' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [accepted]
              properties:
                accepted: { type: boolean }
      responses:
        '200':
          description: Proposal accepted or declined by an authorized simulation actor
        '403': { $ref: '#/components/responses/forbidden' }
        '409': { $ref: '#/components/responses/conflict' }
        '412': { $ref: '#/components/responses/precondition' }
        '422': { $ref: '#/components/responses/invalid' }
  /worlds/{world}/organizations:
    get:
      tags: [Organizations]
      operationId: listWorldOrganizations
      description: Read source-pinned charter definitions and current memberships.
      parameters:
        - $ref: '#/components/parameters/world'
      responses:
        '200':
          description: Fictional or carefully curated international organizations
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '404': { $ref: '#/components/responses/notFound' }
  /worlds/{world}/organizations/{organization}:
    get:
      tags: [Organizations]
      operationId: readWorldOrganization
      description: Read the current membership, applications and withdrawal notices.
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/organization'
      responses:
        '200':
          description: Organization with membership history
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '404': { $ref: '#/components/responses/notFound' }
  /worlds/{world}/organizations/{organization}/applications:
    post:
      tags: [Organizations]
      operationId: requestOrganizationMembership
      description: A membership application is a request, not immediate accession.
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/organization'
        - $ref: '#/components/parameters/idempotency'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [applicant]
              properties:
                applicant: { $ref: '#/components/schemas/GeopoliticalActorId' }
      responses:
        '202': { description: Membership application opened for member-state vote }
        '403': { $ref: '#/components/responses/forbidden' }
        '409': { $ref: '#/components/responses/conflict' }
        '412': { $ref: '#/components/responses/precondition' }
        '422': { $ref: '#/components/responses/invalid' }
        '428': { $ref: '#/components/responses/missingPrecondition' }
  /worlds/{world}/organizations/{organization}/votes:
    post:
      tags: [Organizations]
      operationId: voteOnOrganizationMembership
      description: Authorized state vote; votes by AI-only states require trusted AI identity.
      parameters:
        - $ref: '#/components/parameters/world'
        - $ref: '#/components/parameters/organization'
        - $ref: '#/components/parameters/idempotency'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [voter, application_id, approve]
              properties:
                voter: { $ref: '#/components/schemas/GeopoliticalActorId' }
                application_id: { $ref: '#/components/schemas/Identifier' }
                approve: { type: boolean }
      responses:
        '200': { description: Vote recorded without immediate treaty accession }
        '403': { $ref: '#/components/responses/forbidden' }
        '409': { $ref: '#/components/responses/conflict' }
        '412': { $ref: '#/components/responses/precondition' }
        '422': { $ref: '#/components/responses/invalid' }
        '428': { $ref: '#/components/responses/missingPrecondition' }
  /worlds/{world}/organizations/{organization}/formalizations:
    post:
      tags: [Organizations]
      operationId: formalizeOrganizationMembership
      description: Trusted service only; approval threshold and ratification delay must be satisfied.
      parameters:
