openapi: 3.1.0
info:
  title: World Politics Research Alpha
  version: 0.1.0
  description: Isolated deterministic research jobs. Not calibrated forecasting or official ranking.
servers:
  - url: /research/v1
security:
  - researchBearer: []
paths:
  /billing/payg:
    post:
      summary: Select an eligible prepaid tier without granting credits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [plan]
              properties:
                plan: {enum: [standard, pro]}
      responses:
        '200': {description: Selected tier and wallet balance}
        '401': {description: Invalid or held billing identity}
        '409': {description: Active subscription or incompatible prepaid balance}
        '429': {description: Billing admission limit}
  /billing/checkout:
    post:
      summary: Create Stripe test Checkout for an existing ordinary billing identity
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, minLength: 12, maxLength: 100}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [offer]
              properties:
                offer: {enum: [standard-monthly, pro-monthly, standard-credits, pro-credits]}
      responses:
        '201': {description: Hosted test Checkout URL and order ID}
        '409': {description: Order, plan or balance conflict}
        '429': {description: Billing admission limit}
        '503': {description: Stripe disabled or unavailable}
  /billing/portal:
    post:
      summary: Open restricted hosted test customer portal
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '200': {description: Hosted portal URL}
        '409': {description: No bound subscription or unsafe portal configuration}
        '503': {description: Stripe disabled or unavailable}
  /stripe/webhook:
    post:
      security: []
      summary: Signed Stripe test webhook; not a client API
      parameters:
        - in: header
          name: Stripe-Signature
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '200': {description: Verified event processed or ignored}
        '400': {description: Invalid signature or event edition}
        '503': {description: Disabled or retryable processing failure}
  /usage:
    get:
      responses:
        '200': {description: Remaining included and prepaid usage units and lifetime consumption}
        '429': {description: Hard capacity limit}
  /entitlements:
    get:
      responses:
        '200': {description: Active server-side subscription and capabilities}
  /worlds:
    get:
      responses:
        '200': {description: Own research experiment collections}
    post:
      responses:
        '201': {description: Create own collection with Idempotency-Key}
  /worlds/{world}/experiments:
    post:
      parameters:
        - in: path
          name: world
          required: true
          schema: {type: string}
      responses:
        '202': {description: Queue experiment in own collection}
  /worlds/{world}/simulation:
    parameters:
      - in: path
        name: world
        required: true
        schema: {type: string}
    post:
      responses:
        '201': {description: Initialize isolated persistent French domestic research world}
    get:
      responses:
        '200': {description: Verified persistent simulation state}
  /worlds/{world}/simulation/step:
    post:
      parameters:
        - in: path
          name: world
          required: true
          schema: {type: string}
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision, days, policy]
              properties:
                expected_revision: {type: integer, minimum: 0}
                days: {type: integer, minimum: 1, maximum: 7}
                policy: {type: [string, 'null']}
      responses:
        '200': {description: Verified state-action-next-state transition}
        '402': {description: Insufficient credits}
        '409': {description: Stale revision, unsupported hypothesis or horizon}
  /worlds/{world}/simulation/dataset:
    get:
      parameters:
        - in: path
          name: world
          required: true
          schema: {type: string}
      responses:
        '200': {description: Own signed replayed transition dataset, ten records per page}
  /worlds/{world}/dataset:
    get:
      parameters:
        - in: path
          name: world
          required: true
          schema: {type: string}
      responses:
        '200': {description: Own world dataset page}
  /datasets/transitions:
    get:
      responses:
        '200': {description: Research Pro global eligible persistent state-action-next-state transitions}
        '403': {description: Research Pro required}
  /datasets/game-worlds:
    get:
      responses:
        '200': {description: Approved synthetic game-world aggregate feature page}
        '403': {description: Research Pro required}
  /datasets/{scope}:
    get:
      parameters:
        - in: path
          name: scope
          required: true
          schema: {enum: [own, global]}
      responses:
        '200': {description: Dataset page with highwater and next cursor}
        '403': {description: Global dataset requires active Research Pro}
  /models:
    get:
      responses:
        '200': {description: Model catalogue and version pins}
  /experiments:
    post:
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, minLength: 12, maxLength: 100}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [type, parameters]
              properties:
                type: {enum: [programme-coverage, policy-capacity, working-hours, household-sensitivity, household-backtest, fiscal-path, family-transfer, countries]}
                parameters: {type: object}
      responses:
        '202': {description: Job accepted}
        '409': {description: Contract or quota rejected}
  /experiments/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string, pattern: '^[a-f0-9]{32}$'}
    get:
      responses:
        '200': {description: Own job state and completed report}
        '404': {description: Not found}
    delete:
      responses:
        '200': {description: Queued job cancelled}
        '409': {description: Job no longer queued}
  /experiments/{id}/csv:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
      responses:
        '200': {description: JSON containing CSV and result digest}
components:
  securitySchemes:
    researchBearer:
      type: http
      scheme: bearer
