name: WP117 public Manifesto catalogue freeze
on:
  push:
    branches: ['data/wp117-manifesto-catalogue-2026a']
    paths:
      - 'games/world-politics/bin/collect-wp117-manifesto.py'
      - '.github/workflows/world-politics-wp117-manifesto.yml'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 games/world-politics/bin/collect-wp117-manifesto.py
      - name: Commit validated bibliography on staging branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/data/wp117-manifesto-catalogue-2026a
          git add -- games/world-politics/data/wp117-manifesto-2026a-v1/documents.json
          git diff --cached --quiet && exit 0
          git -c user.name='WP117 evidence collector' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'WP117: freeze public Manifesto Project 2026a document bibliography'
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:refs/heads/data/wp117-manifesto-catalogue-2026a
