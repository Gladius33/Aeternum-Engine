name: WP115 parliamentary evidence freeze
on:
  push:
    branches: [feat/world-politics-wp01-identity-government]
    paths: ['.github/workflows/world-politics-wp115-ipu.yml']
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
      - name: Collect public parliamentary result tables
        run: |
          set -euo pipefail
          target=games/world-politics/data/wp115-ipu-party-seats-2026-11-27-v1.json
          test ! -e "$target"
          python3 games/world-politics/bin/collect-wp115-ipu.py --output "$target"
          git add -- "$target"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "WP115: freeze IPU historical parliamentary seat references"
          git push origin HEAD:refs/heads/feat/world-politics-wp01-identity-government
