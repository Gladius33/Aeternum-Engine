name: PHP core CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

# Cancel stale PR checks on new commits, but never interrupt post-merge main checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer validate --strict --no-check-publish
      - run: find packages tests bin public -name '*.php' -print0 | xargs -0 -r -n1 php -l
      - run: php tests/run.php
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Type-check and bundle Vue/TypeScript client
        run: |
          npm ci --prefix client --no-audit --no-fund
          npm run build --prefix client
          npm test --prefix client
          test -s public/client-dist/aeternum-shell.js
          composer dump-autoload --no-interaction
          bash tests/m11-package.sh

  mariadb:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-local-only
          MARIADB_DATABASE: aeternum_test
          MARIADB_USER: aeternum_test
          MARIADB_PASSWORD: ci-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
          tools: composer:v2
      - run: composer dump-autoload --no-interaction
      - run: php tests/integration.php
        env:
          AETERNUM_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=aeternum_test;charset=utf8mb4
          AETERNUM_TEST_USER: aeternum_test
          AETERNUM_TEST_PASSWORD: ci-test-only
      - name: Read-only M01 host preflight (safe invite policy and unsafe rejection)
        shell: bash
        env:
          AETERNUM_DSN: mysql:host=127.0.0.1;port=3306;dbname=aeternum_test;charset=utf8mb4
          AETERNUM_DB_USER: aeternum_test
          AETERNUM_DB_PASSWORD: ci-test-only
          AETERNUM_MEDIEVAL_WORLD: ci-preflight-world
          AETERNUM_PUBLIC_REGISTRATION: '1'
          AETERNUM_SIGNUP_REQUIRE_INVITE: '1'
          AETERNUM_TRUSTED_PROXY_IPS: 127.0.0.1
        run: |
          set -Eeuo pipefail
          php bin/m01-preflight.php > m01-ci-preflight.json
          php -r '$r=json_decode(file_get_contents("m01-ci-preflight.json"),true,8,JSON_THROW_ON_ERROR); if(!$r["configurationPassed"] || $r["registrationPolicy"]!=="invitation-only") exit(1);'
          if AETERNUM_SIGNUP_REQUIRE_INVITE=0 php bin/m01-preflight.php > m01-ci-rejection.json; then
            echo 'Unsafe open signup unexpectedly passed preflight'
            exit 1
          fi
          rm -f m01-ci-preflight.json m01-ci-rejection.json
      - name: Parallel signup load on disposable MariaDB
        env:
          AETERNUM_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=aeternum_test;charset=utf8mb4
          AETERNUM_TEST_USER: aeternum_test
          AETERNUM_TEST_PASSWORD: ci-test-only
        run: php tests/signup-load.php
      - name: Dump, restore, fingerprint and replay all lab data
        shell: bash
        env:
          AETERNUM_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=aeternum_test;charset=utf8mb4
          AETERNUM_RESTORE_DSN: mysql:host=127.0.0.1;port=3306;dbname=aeternum_restore;charset=utf8mb4
          AETERNUM_TEST_USER: aeternum_test
          AETERNUM_TEST_PASSWORD: ci-test-only
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-client
          dump_dir="$(mktemp -d)"
          trap 'rm -rf "$dump_dir"' EXIT
          MYSQL_PWD=ci-test-only mariadb-dump --host=127.0.0.1 --user=aeternum_test \
            --single-transaction --quick --skip-lock-tables aeternum_test > "$dump_dir/backup.sql"
          test -s "$dump_dir/backup.sql"
          MYSQL_PWD=ci-local-only mariadb --host=127.0.0.1 --user=root \
            -e "CREATE DATABASE aeternum_restore CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          MYSQL_PWD=ci-local-only mariadb --host=127.0.0.1 --user=root aeternum_restore < "$dump_dir/backup.sql"
          MYSQL_PWD=ci-local-only mariadb --host=127.0.0.1 --user=root \
            -e "GRANT SELECT ON aeternum_restore.* TO 'aeternum_test'@'%'; FLUSH PRIVILEGES;"
          php tests/restore-verify.php
