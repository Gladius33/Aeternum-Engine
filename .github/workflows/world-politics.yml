          php tests/wp24-france-social-rest-db.php
          php tests/wp27-world-mutation-fence-db.php
          php tests/wp17-world-clock-db.php
          php tests/wp18-world-clock-institutions-db.php
          php tests/wp25-fr-parliament-world-clock-db.php
          php tests/wp26-fr-sitting-calendar-db.php
          php tests/wp28-french-parliament-db.php
          php tests/wp29-final-db.php
          php tests/wp118-119-career-db.php
          php tests/wp123-research-db.php
        env:
          WP_TEST_ISOLATED: 'YES'
          WP_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=wp_test;charset=utf8mb4
          WP_TEST_USER: wp_test
          WP_TEST_PASSWORD: ci-only

  private-alpha-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-only
          MARIADB_DATABASE: wp_test
          MARIADB_USER: wp_test
          MARIADB_PASSWORD: ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      WP_TEST_ISOLATED: 'YES'
      WP_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=wp_test;charset=utf8mb4
      WP_DB_USER: wp_test
      WP_DB_PASSWORD: ci-only
      WP_ALPHA_INSTALL: 'YES'
      WP_ALPHA_ENABLED: 'YES'
      WP_ALPHA_LOOPBACK: 'YES'
      WP_ALPHA_INVITE: ci-only-private-alpha-enrollment-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0 (node24)
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring
          coverage: none
      - name: Install isolated game schema and test real HTTP
        run: |
          php -l games/world-politics/public/index.php
          php -l games/world-politics/bin/prune-alpha.php
          php games/world-politics/bin/install-alpha.php
          export WP_CAREER_EVIDENCE_KEY=ci-only-career-evidence-key-not-for-deployment
          php -S 127.0.0.1:18730 -t games/world-politics/public games/world-politics/public/index.php > /tmp/wp30-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; cat /tmp/wp30-http.log' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18730/api/v1/health >/dev/null; then break; fi
            sleep 1
          done
          php tests/wp30-http.php
          php tests/wp118-119-career-http.php
          php tests/wp71-finance-2028-db.php
          php tests/wp99-corrective-finance-db.php
      - name: WP96 isolated logical backup restoration and read-only audit
        env:
          WP_CI_MARIADB_CONTAINER: ${{ job.services.mariadb.id }}
        run: |
          set -euo pipefail
          test "$WP_TEST_ISOLATED" = YES
          test -n "$WP_CI_MARIADB_CONTAINER"
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          root_sql() {
            docker exec -i -e MYSQL_PWD=ci-only "$WP_CI_MARIADB_CONTAINER" mariadb -uroot --batch --skip-column-names "$@"
          }
          world=$(root_sql wp_test -e "SELECT world_id FROM wp_alpha_worlds WHERE label='Investiture 2027' LIMIT 1")
          [[ "$world" =~ ^[a-z][a-z0-9_-]{0,63}$ ]]
          root_sql -e "CREATE DATABASE wp_restore; CREATE USER 'wp_audit_ci'@'%' IDENTIFIED BY 'ci-audit-only'; GRANT SELECT ON wp_test.* TO 'wp_audit_ci'@'%'; GRANT SELECT ON wp_restore.* TO 'wp_audit_ci'@'%';"
          export WP_RELEASE_AUDIT=YES WP_DB_USER=wp_audit_ci WP_DB_PASSWORD=ci-audit-only
          php games/world-politics/bin/audit-campaign.php "$world" > "$tmp/before.json"
          docker exec -e MYSQL_PWD=ci-only "$WP_CI_MARIADB_CONTAINER" mariadb-dump -uroot --single-transaction --skip-lock-tables wp_test > "$tmp/dump.sql"
          test -s "$tmp/dump.sql"
          root_sql wp_restore < "$tmp/dump.sql"
          export WP_DB_DSN=mysql:host=127.0.0.1\;port=3306\;dbname=wp_restore\;charset=utf8mb4
          php games/world-politics/bin/audit-campaign.php "$world" > "$tmp/after.json"
          cmp "$tmp/before.json" "$tmp/after.json"
          if docker exec -e MYSQL_PWD=ci-audit-only "$WP_CI_MARIADB_CONTAINER" mariadb -uwp_audit_ci wp_restore -e "UPDATE wp_accounts SET enabled=0 WHERE 1=0"; then
            echo "Audit account unexpectedly has write access" >&2
            exit 1
          fi
          echo "Restored campaign audit identical; read-only writer denied"
      - name: WP100 two-node shared MariaDB concurrency regression
        env:
          WP_CI_MARIADB_CONTAINER: ${{ job.services.mariadb.id }}
        run: |
          set -euo pipefail
          test "$WP_TEST_ISOLATED" = YES
          docker exec -e MYSQL_PWD=ci-only "$WP_CI_MARIADB_CONTAINER" mariadb -uroot -e "CREATE DATABASE wp_test_multinode; GRANT ALL ON wp_test_multinode.* TO 'wp_test'@'%';"
          export WP_DB_DSN='mysql:host=127.0.0.1;port=3306;dbname=wp_test_multinode;charset=utf8mb4'
          php games/world-politics/bin/install-alpha.php
          php -S 127.0.0.1:18731 -t games/world-politics/public games/world-politics/public/index.php > /tmp/wp100-a.log 2>&1 &
          first=$!
          php -S 127.0.0.1:18732 -t games/world-politics/public games/world-politics/public/index.php > /tmp/wp100-b.log 2>&1 &
          second=$!
          trap 'kill "$first" "$second" 2>/dev/null || true; cat /tmp/wp100-a.log /tmp/wp100-b.log' EXIT
          for port in 18731 18732; do
            for i in $(seq 1 30); do
              if curl --fail --silent "http://127.0.0.1:$port/api/v1/health" >/dev/null; then break; fi
              sleep 1
            done
            curl --fail --silent "http://127.0.0.1:$port/api/v1/health" >/dev/null
          done
          python3 tests/wp100-multinode.py
          php tests/wp102-universes.php
