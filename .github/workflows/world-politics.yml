name: World Politics headless backend
on:
  push:
    branches:
      - 'feat/world-politics-*'
    paths:
      - 'games/world-politics/**'
      - 'tests/wp*.php'
      - 'docs/WORLD_POLITICS*.md'
      - '.github/workflows/world-politics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  headless-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0 (node24)
        with:
          php-version: '8.4'
          coverage: none
      - name: PHP syntax check
        run: |
          find games/world-politics/src -name '*.php' -print0 | xargs -0 -n1 php -l
          find tests -maxdepth 1 -name 'wp*.php' -print0 | xargs -0 -n1 php -l
      - name: Political identity domain tests
        run: php tests/wp01-political-roster.php
      - name: REST contract tests (no running server)
        run: php tests/wp01-rest-contract.php
      - name: Quick and detailed candidate template acceptance
        run: php tests/wp02-profile-template.php
      - name: Validate OpenAPI 3.1 structure
        run: |
          ruby -ryaml -e '
            d = YAML.load_file(ARGV.fetch(0))
            abort "Missing OpenAPI 3.1" unless d["openapi"] == "3.1.0"
            abort "Missing REST paths" unless d["paths"].is_a?(Hash) && d["paths"].size >= 12
            abort "Missing components" unless d["components"].is_a?(Hash)
            abort "Missing diplomacy schema" unless d["paths"].key?("/worlds/{world}/diplomacy/proposals")
            abort "Missing candidate schema" unless d.dig("components","schemas","CharacterCreate")
            abort "Missing organization API routes" unless d["paths"].key?("/worlds/{world}/organizations/{organization}/votes")
            abort "Missing NPC voting endpoint" unless d["paths"].key?("/worlds/{world}/organizations/ai/decisions")
            abort "Missing economic scenario REST endpoints" unless d["paths"].key?("/worlds/{world}/economy/policies/{policyId}/authorization")
            abort "Missing authoritative world clock REST endpoint" unless d["paths"].key?("/worlds/{world}/clock/advances")
            abort "Missing pinned national clock roster" unless d.dig("components","schemas","WorldClockState","properties","countries")
            abort "Missing French 49.3 API" unless d["paths"].key?("/worlds/{world}/france/constitution/engagements")
            abort "Missing French 49.1 confidence API" unless d["paths"].key?("/worlds/{world}/france/constitution/confidence/{statementId}/votes")
            abort "Missing spontaneous 49.2 censure API" unless d["paths"].key?("/worlds/{world}/france/constitution/spontaneous-motions/{motionId}/votes")
            abort "Missing persisted France social scenario endpoint" unless d["paths"].key?("/worlds/{world}/france/social/assessments")
            abort "Missing French Assembly sitting calendar REST endpoint" unless d["paths"].key?("/worlds/{world}/france/calendar/motions/{motionId}")
            abort "Missing French individual deputy ballot API" unless d["paths"].key?("/worlds/{world}/france/assembly/ballots")
            abort "Missing parliamentary censure signatures API" unless d["paths"].key?("/worlds/{world}/france/assembly/signatures")
            abort "Missing Articles 8/50 presidential succession API" unless d["paths"].key?("/worlds/{world}/france/constitution/presidency/prime-minister-appointments")
            abort "Missing Paris parliamentary clock flag" unless d.dig("components","schemas","WorldClockState","properties","france_parliament_enabled")
            puts "PASS OpenAPI 3.1: syntax, required paths and DTOs"
          ' games/world-politics/api/openapi.yaml
      - name: Reviewed geopolitical statuses and deterministic diplomacy
        run: php tests/wp06-diplomacy.php
      - name: Charter-configured international institutions
        run: php tests/wp09-organizations.php
      - name: Causal and source-attributed scenario economy WP12
        run: php tests/wp12-economic-domain.php
      - name: Offline and rights-aware World Bank data importer WP14
        run: php tests/wp14-worldbank-import.php
      - name: Trusted diplomacy to economy causal bridge WP15
        run: php tests/wp15-diplomacy-economic-bridge.php
      - name: Constitutional domain and country selection WP05
        run: php tests/wp05-institutions.php
      - name: France Article 49.3 legal workflow WP19
        run: php tests/wp19-france-49-3.php
      - name: France Article 49.1 confidence and 49.2 spontaneous censure WP22
        run: php tests/wp22-france-49-1-49-2.php
      - name: France sitting days and censure scheduling WP26
        run: php tests/wp26-fr-sitting-calendar.php
      - name: French parliamentary deputy roll calls and coalitions WP28
        run: php tests/wp28-french-parliament.php
      - name: Domestic policy fiscal ledger and multi-day scenario WP29A
        run: php tests/wp29a-domestic-policy.php
      - name: WP33 election, seat allocation and coalition regression
        run: php tests/wp33-electoral.php
      - name: WP32 comparative accountability regression
        run: php tests/wp32-accountability.php
      - name: WP31 global country and reference archive tests
        run: php tests/wp31-references.php
      - name: WP29E extended fiscal and social scenarios
        run: php tests/wp29e-economic.php
      - name: Sectoral social and economic reaction WP20
        run: php tests/wp20-france-social.php

  mariadb-rosters:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-only
          MARIADB_DATABASE: wp_test
          MARIADB_USER: wp_test
          MARIADB_PASSWORD: ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0 (node24)
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
      - name: Transactional persistent roster and journal regression
        run: |
          php tests/wp29b-domestic-policy-db.php
          php tests/wp03-store-db.php
          php tests/wp04-rest-db.php
          php tests/wp06-institutions-db.php
          php tests/wp07-institutional-rest-db.php
          php tests/wp08-diplomacy-db.php
          php tests/wp10-organization-rest-db.php
          php tests/wp11-organization-ai-db.php
          php tests/wp13-economic-rest-db.php
          php tests/wp16-sanctions-outbox-db.php
          php tests/wp21-france-constitutional-rest-db.php
          php tests/wp23-france-accountability-rest-db.php
          php tests/wp24-france-social-rest-db.php
          php tests/wp27-world-mutation-fence-db.php
          php tests/wp17-world-clock-db.php
          php tests/wp18-world-clock-institutions-db.php
          php tests/wp25-fr-parliament-world-clock-db.php
          php tests/wp26-fr-sitting-calendar-db.php
          php tests/wp28-french-parliament-db.php
          php tests/wp29-final-db.php
        env:
          WP_TEST_ISOLATED: 'YES'
          WP_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=wp_test;charset=utf8mb4
          WP_TEST_USER: wp_test
          WP_TEST_PASSWORD: ci-only

  private-alpha-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-only
          MARIADB_DATABASE: wp_test
          MARIADB_USER: wp_test
          MARIADB_PASSWORD: ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      WP_TEST_ISOLATED: 'YES'
      WP_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=wp_test;charset=utf8mb4
      WP_DB_USER: wp_test
      WP_DB_PASSWORD: ci-only
      WP_ALPHA_INSTALL: 'YES'
      WP_ALPHA_ENABLED: 'YES'
      WP_ALPHA_LOOPBACK: 'YES'
      WP_ALPHA_INVITE: ci-only-private-alpha-enrollment-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0 (node24)
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring
          coverage: none
      - name: Install isolated game schema and test real HTTP
        run: |
          php -l games/world-politics/public/index.php
          php games/world-politics/bin/install-alpha.php
          php -S 127.0.0.1:18730 -t games/world-politics/public games/world-politics/public/index.php > /tmp/wp30-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; cat /tmp/wp30-http.log' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18730/api/v1/health >/dev/null; then break; fi
            sleep 1
          done
          php tests/wp30-http.php
