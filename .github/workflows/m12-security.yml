name: M12 security and supply-chain
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  defensive-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Validate PHP boundary syntax
        run: |
          php -l packages/core/src/ApiResponseSecurity.php
          php -l public/index.php
          php -l tests/m12-security-headers.php
      - name: Security regression unit tests
        run: php tests/run.php
      - name: Live loopback HTTP rejection smoke
        run: bash tests/m12-http-smoke.sh
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit locked client dependencies, including dev toolchain
        run: npm audit --prefix client --audit-level=high

      - name: Propose Vue security lockfile remediation in diagnostic logs
        if: failure()
        run: |
          npm install --prefix client --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund vue@3.5.46
          node <<'NODE'
          const lock=require('./client/package-lock.json');
          console.log('M12_FULL_LOCK_START');
          console.log(JSON.stringify(lock));
          console.log('M12_FULL_LOCK_END');
          NODE
