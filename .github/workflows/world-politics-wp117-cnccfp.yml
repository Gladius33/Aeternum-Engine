name: WP117 one-shot CNCCFP evidence freeze
on:
  push:
    branches: ['data/wp117-cnccfp-2024']
    paths:
      - 'games/world-politics/bin/collect-wp117-cnccfp.py'
      - '.github/workflows/world-politics-wp117-cnccfp.yml'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate official accounting dataset identifiers
        run: python3 games/world-politics/bin/collect-wp117-cnccfp.py
      - name: Commit only validated party identifiers to staging branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/data/wp117-cnccfp-2024
          git add -- games/world-politics/data/wp117-cnccfp-2024-v1/parties.json
          git diff --cached --quiet && exit 0
          git -c user.name='WP117 evidence collector' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'WP117: freeze CNCCFP 2024 documentary party identifiers'
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:refs/heads/data/wp117-cnccfp-2024
