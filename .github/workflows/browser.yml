name: Browser E2E
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

# Cancel stale PR checks on new commits, but never interrupt post-merge main checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: test-root-only
          MARIADB_DATABASE: aeternum_e2e
          MARIADB_USER: aeternum
          MARIADB_PASSWORD: test-db-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      AETERNUM_DSN: mysql:host=127.0.0.1;port=3306;dbname=aeternum_e2e;charset=utf8mb4
      AETERNUM_DB_USER: aeternum
      AETERNUM_DB_PASSWORD: test-db-only
      AETERNUM_MEDIEVAL_WORLD: e2e-medieval
      AETERNUM_INDUSTRIAL_WORLD: e2e-industrial
      AETERNUM_BROWSER_TEST: '1'
      AETERNUM_PUBLIC_REGISTRATION: '1'
      AETERNUM_LAB_ALLOW_UNVERIFIED_SIGNUP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime and browser
        run: |
          composer dump-autoload --no-interaction
          npm install --no-save --package-lock=false @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Migrate and provision both games
        run: |
          php bin/migrate.php
          printf '%s\n' 'browser-only test password' | php bin/provision.php reference-medieval e2e-medieval browser-medieval
          printf '%s\n' 'browser-only test password' | php bin/provision.php reference-industrial e2e-industrial browser-industrial
          printf '%s\n' 'browser-only test password' | php bin/provision.php reference-medieval e2e-medieval browser-medieval-sender
          printf '%s\n' 'browser-only test password' | php bin/provision.php reference-medieval e2e-medieval browser-medieval-receiver
      - name: Seed additive M04 map with two real world members
        run: |
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $pdo=new PDO(getenv('AETERNUM_DSN'),getenv('AETERNUM_DB_USER'),getenv('AETERNUM_DB_PASSWORD'),[
              PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION,PDO::ATTR_EMULATE_PREPARES=>false
          ]);
          $entity=new Aeternum\Core\PdoEntities($pdo,'e2e-medieval');
          foreach (['crossroads','hill','ford'] as $id) $entity->addLocation($id);
          $map=new Aeternum\Core\PdoTerritories($pdo,'e2e-medieval');
          $map->define('east','hill','forest');
          $map->define('west','ford','village');
          $q=$pdo->prepare('SELECT actor_id FROM engine_identities WHERE login=?');
          $q->execute(['browser-medieval-sender']);$sender=$q->fetchColumn();
          $q->execute(['browser-medieval-receiver']);$receiver=$q->fetchColumn();
          if (!is_string($sender) || !is_string($receiver) || $sender===$receiver) throw new RuntimeException('Invalid multiplayer fixture');
          $map->assign('east',$sender);
          $map->assign('west',$receiver);
          (new Aeternum\Core\PdoTopology($pdo,'e2e-medieval'))->connect('crossroads','hill',3);
          $entity->provision('sender-hill','hill',$sender,'settlement');
          $entity->provision('receiver-ford','ford',$receiver,'settlement');
          $buildings=new Aeternum\Core\PdoBuildings($pdo,'e2e-medieval');
          $buildings->define('mill',[
              ['costs'=>['wood'=>5,'grain'=>4],'duration'=>60,'requires'=>[]],
              ['costs'=>['wood'=>20],'duration'=>120,'requires'=>['workshop'=>1]]
          ]);
          $buildings->establish('sender-mill','east','sender-hill',$sender,'mill');
          $buildings->establish('receiver-mill','west','receiver-ford',$receiver,'mill');
          PHP
      - name: Run real browser scenarios
        shell: bash
        run: |
          set -Eeuo pipefail
          # Ephemeral localhost TLS termination proxy never exposed externally.
          tls_dir="$(mktemp -d)"
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$tls_dir/key.pem" -out "$tls_dir/cert.pem" -days 1 \
            -subj '/CN=localhost' -addext 'subjectAltName=IP:127.0.0.1,DNS:localhost' >/dev/null 2>&1
          # Exercise the public server through the M02 registry, without
          # modifying the reference browser scenarios or either pinned world.
          # Install the independent fixture only inside this disposable CI workspace.
          mkdir -p games/sdk-fixture
          cp tests/fixtures/m02-packs/sdk-fixture/manifest.json games/sdk-fixture/manifest.json
          registry_dir="$(mktemp -d)"
          php -r '
            $worlds=[];
            foreach (["e2e-medieval"=>"reference-medieval","e2e-industrial"=>"reference-industrial","e2e-sdk"=>"sdk-fixture"] as $world=>$id) {
              $manifest="games/".$id."/manifest.json";
              $pack=json_decode(file_get_contents($manifest),true,32,JSON_THROW_ON_ERROR);
              $worlds[]=["world"=>$world,"pack"=>$id,"version"=>$pack["version"],"sha256"=>hash_file("sha256",$manifest)];
            }
            file_put_contents($argv[1],json_encode(["registry_api"=>"1","worlds"=>$worlds],JSON_THROW_ON_ERROR));
          ' "$registry_dir/worlds.json"
          php bin/registry-status.php "$registry_dir/worlds.json" > "$registry_dir/validated.json"
          printf '%s\n' 'browser-only test password' | env -u AETERNUM_MEDIEVAL_WORLD -u AETERNUM_INDUSTRIAL_WORLD \
            AETERNUM_WORLD_REGISTRY="$registry_dir/worlds.json" \
            php bin/provision.php sdk-fixture e2e-sdk browser-sdk
          env -u AETERNUM_MEDIEVAL_WORLD -u AETERNUM_INDUSTRIAL_WORLD \
            AETERNUM_WORLD_REGISTRY="$registry_dir/worlds.json" AETERNUM_TRUSTED_PROXY_IPS=127.0.0.1 \
            php -S 127.0.0.1:8765 -t public tests/browser/router.php >browser-server.log 2>&1 &
          server=$!
          AETERNUM_TEST_TLS_KEY="$tls_dir/key.pem" AETERNUM_TEST_TLS_CERT="$tls_dir/cert.pem" \
            node tests/browser/tls-proxy.cjs >browser-tls.log 2>&1 &
          tls_server=$!
          # A second HTTPS-emulated loopback server enables real invitation-mode E2E.
          php bin/invite.php e2e-industrial 1 > tests/browser/.e2e-invite-token
          AETERNUM_SIGNUP_REQUIRE_INVITE=1 php -S 127.0.0.1:8766 -t public tests/browser/router.php >browser-invited.log 2>&1 &
          invited_server=$!
          # Third server isolates the optional verified-email path from the
          # backwards-compatible registration tests above.
          activation_dir="$(mktemp -d)"
          AETERNUM_SIGNUP_REQUIRE_EMAIL_ACTIVATION=1 AETERNUM_TEST_ACTIVATION_OUTBOX="$activation_dir" \
            php -S 127.0.0.1:8767 -t public tests/browser/router.php >browser-activation.log 2>&1 &
          activation_server=$!
          AETERNUM_TEST_TLS_KEY="$tls_dir/key.pem" AETERNUM_TEST_TLS_CERT="$tls_dir/cert.pem" \
            AETERNUM_TEST_TLS_PORT=8778 AETERNUM_TEST_BACKEND_PORT=8767 \
            node tests/browser/tls-proxy.cjs >browser-activation-tls.log 2>&1 &
          activation_tls=$!
          # In a fourth server, opening public registration without ANY identity
          # proof MUST fail closed; this does not have the local lab bypass.
          AETERNUM_LAB_ALLOW_UNVERIFIED_SIGNUP=0 php -S 127.0.0.1:8768 -t public tests/browser/router.php >browser-unsafe-policy.log 2>&1 &
          unsafe_server=$!
          trap 'kill "$server" "$invited_server" "$tls_server" "$activation_server" "$activation_tls" "$unsafe_server" 2>/dev/null || true; rm -f tests/browser/.e2e-invite-token; rm -rf "$tls_dir" "$activation_dir" "$registry_dir"' EXIT
          for n in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8766/play.html >/dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8766/play.html >/dev/null
          for n in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/play.html >/dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8765/play.html >/dev/null
          for n in {1..30}; do
            if curl --fail --silent --cacert "$tls_dir/cert.pem" https://127.0.0.1:8777/play.html >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --cacert "$tls_dir/cert.pem" https://127.0.0.1:8777/play.html >/dev/null
          # Existing multiplayer/recovery expectations must run before the extra
          # TLS test player is added to the shared industrial world.
          # Rate limits remain enabled for both Chromium suites.
          npx playwright test tests/browser/economy.spec.cjs --workers=1 --reporter=github,line
          npx playwright test tests/browser/tls.spec.cjs --workers=1 --reporter=github,line
          for n in {1..30}; do
            if curl --fail --silent --cacert "$tls_dir/cert.pem" https://127.0.0.1:8778/play.html >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --cacert "$tls_dir/cert.pem" https://127.0.0.1:8778/play.html >/dev/null
          AETERNUM_TEST_ACTIVATION_OUTBOX="$activation_dir" \
            npx playwright test tests/browser/activation.spec.cjs --workers=1 --reporter=github,line
          npx playwright test tests/browser/registry.spec.cjs --workers=1 --reporter=github,line
      - name: Server diagnostics
        if: failure()
        run: |
          echo '=== Public server ==='
          tail -n 150 browser-server.log || true
          echo '=== Invitation server ==='
          tail -n 150 browser-invited.log || true
          echo '=== Loopback TLS terminator ==='
          tail -n 150 browser-tls.log || true
          echo '=== Mailbox activation loopback server ==='
          tail -n 150 browser-activation.log || true
          echo '=== Mailbox TLS terminator ==='
          tail -n 150 browser-activation-tls.log || true
          echo '=== Unsafe signup policy refusal server ==='
          tail -n 150 browser-unsafe-policy.log || true

      - name: Preserve Chromium failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-e2e-failure
          if-no-files-found: ignore
          retention-days: 7
          path: |
            test-results/
            playwright-report/
            browser-server.log
            browser-invited.log
            browser-tls.log
            browser-activation.log
            browser-activation-tls.log
            browser-unsafe-policy.log
