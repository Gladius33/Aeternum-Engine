name: Browser E2E
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

# Cancel stale PR checks on new commits, but never interrupt post-merge main checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: test-root-only
          MARIADB_DATABASE: aeternum_e2e
          MARIADB_USER: aeternum
          MARIADB_PASSWORD: test-db-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      AETERNUM_DSN: mysql:host=127.0.0.1;port=3306;dbname=aeternum_e2e;charset=utf8mb4
      AETERNUM_DB_USER: aeternum
      AETERNUM_DB_PASSWORD: test-db-only
      AETERNUM_MEDIEVAL_WORLD: e2e-medieval
      AETERNUM_INDUSTRIAL_WORLD: e2e-industrial
      AETERNUM_BROWSER_TEST: '1'
      AETERNUM_PUBLIC_REGISTRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime and browser
        run: |
          composer dump-autoload --no-interaction
          npm install --no-save --package-lock=false @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Migrate and provision both games
        run: |
          php bin/migrate.php
          printf '%s\n' 'browser-only test password' | php bin/provision.php reference-medieval e2e-medieval browser-medieval
          printf '%s\n' 'browser-only test password' | php bin/provision.php reference-industrial e2e-industrial browser-industrial
          printf '%s\n' 'browser-only test password' | php bin/provision.php reference-medieval e2e-medieval browser-medieval-sender
          printf '%s\n' 'browser-only test password' | php bin/provision.php reference-medieval e2e-medieval browser-medieval-receiver
      - name: Run real browser scenarios
        shell: bash
        run: |
          set -Eeuo pipefail
          php -S 127.0.0.1:8765 -t public tests/browser/router.php >browser-server.log 2>&1 &
          server=$!
          # A second HTTPS-emulated loopback server enables real invitation-mode E2E.
          php bin/invite.php e2e-industrial 1 > tests/browser/.e2e-invite-token
          AETERNUM_SIGNUP_REQUIRE_INVITE=1 php -S 127.0.0.1:8766 -t public tests/browser/router.php >browser-invited.log 2>&1 &
          invited_server=$!
          trap 'kill "$server" "$invited_server" 2>/dev/null || true; rm -f tests/browser/.e2e-invite-token' EXIT
          for n in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8766/play.html >/dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8766/play.html >/dev/null
          for n in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/play.html >/dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8765/play.html >/dev/null
          # The scenarios share real peer/auth quotas and persistent worlds.
          # Parallel workers race the same quota and make test order nondeterministic.
          npx playwright test tests/browser/economy.spec.cjs --workers=1 --reporter=github,line
      - name: Server diagnostics
        if: failure()
        run: |
          echo '=== Public server ==='
          tail -n 150 browser-server.log || true
          echo '=== Invitation server ==='
          tail -n 150 browser-invited.log || true
