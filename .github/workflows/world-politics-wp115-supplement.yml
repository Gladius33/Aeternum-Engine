name: WP115 additional economic and social evidence
on:
  push:
    branches: [feat/world-politics-wp01-identity-government]
    paths: ['.github/workflows/world-politics-wp115-supplement.yml']
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
      - name: Gather historical indicators and preserve source responses
        run: |
          set -euo pipefail
          target=games/world-politics/data/wp115-wdi-economic-social-2026-11-27-v2
          if ! python3 games/world-politics/bin/collect-wp115-wdi-economic-social.py --output "$target"; then
            test -s "$target/evidence.json"
          fi
          python3 - "$target" <<'PY'
          import json, pathlib, sys, hashlib
          root=pathlib.Path(sys.argv[1])
          ev=json.loads((root/'evidence.json').read_text())
          assert ev['runtime_admission'] is False and len(ev['country_iso2'])==42
          assert ev['series'], 'no successful source series'
          files={'evidence.json'}
          for code,s in ev['series'].items():
              assert len(s['rows'])==126 and len({(r['iso2'],r['year']) for r in s['rows']})==126
              for f in s['raw_files']:
                  assert hashlib.sha256((root/f['file']).read_bytes()).hexdigest()==f['sha256']
                  files.add(f['file'])
          for p in (root/'raw').glob('*'):
              if p.relative_to(root).as_posix() not in files:
                  p.unlink()
          n=sum(r['value'] is not None for s in ev['series'].values() for r in s['rows'])
          manifest={'schema':'wp115-wdi-economic-social-frozen-v2','series':len(ev['series']),'failed_series':sorted(ev['transport_or_validation_errors']),'countries':42,'numeric_slots':126*len(ev['series']),'non_null':n,'files':{name:hashlib.sha256((root/name).read_bytes()).hexdigest() for name in sorted(files)}}
          (root/'manifest.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n')
          print(json.dumps({k:v for k,v in manifest.items() if k!='files'},sort_keys=True))
          PY
          git add -- "$target"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "WP115: freeze additional historical economic and social evidence"
          git push origin HEAD:refs/heads/feat/world-politics-wp01-identity-government
