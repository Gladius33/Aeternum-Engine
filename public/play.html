<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Aeternum — Economy</title><link rel="stylesheet" href="play.css"><script src="play.js" defer></script></head>
<body><main><h1>Aeternum</h1><p>Reference economy client · operator-provisioned accounts</p>
<form id="login"><h2>Sign in</h2><label>Login <input name="login" autocomplete="username" required></label><label>Password <input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form>
<section id="game" hidden><button id="logout">Sign out</button><button id="retry-command" type="button" hidden>Retry pending action</button><h2>Settlement</h2><button id="discover" type="button">Reload available worlds</button><form id="balance"><label>World <select name="world" required></select></label><label>Account <select name="account" required></select></label><label>Resource <select name="resource" required></select></label><button>Refresh stock</button></form>
<dl id="stock"></dl><form id="action"><label>Action <select name="type"><option value="economy.settle">Settle production</option><option value="economy.upgrade">Upgrade production</option><option value="economy.transfer">Transfer resources</option></select></label><fieldset id="transfer-fields" hidden disabled><legend>Transfer details</legend><button id="load-recipients" type="button">Find recipients</button><label>Available recipients <select id="recipient-directory"><option value="">Choose a recipient</option></select></label><p id="recipient-notice" role="status"></p><label>Recipient account <input name="recipient" maxlength="64" pattern="[A-Za-z0-9][A-Za-z0-9_\\-]{0,63}" required></label><label>Units <input name="units" type="number" min="1" max="1000000000000" step="1" required></label></fieldset><button>Submit action</button></form>
<section id="market-panel"><h2>Market</h2>
<form id="market-create"><h3>Publish a barter offer</h3>
<label>Offered resource <select name="giveResource" required></select></label><label>Offered units <input name="giveUnits" type="number" min="1" max="1000000000000" step="1" value="1" required></label>
<label>Requested resource <select name="wantResource" required></select></label><label>Requested units <input name="wantUnits" type="number" min="1" max="1000000000000" step="1" value="1" required></label>
<button>Create offer</button></form>
<button id="market-load" type="button">Reload market</button><button id="market-next" type="button" hidden>Next market page</button>
<label>Open offers <select id="market-offer"><option value="">Choose an offer</option></select></label>
<button id="market-accept" type="button">Accept selected offer</button><button id="market-cancel" type="button">Cancel selected offer</button><p id="market-notice" role="status"></p>
</section></section>
<p id="status" role="status" aria-live="polite"></p></main></body></html>
