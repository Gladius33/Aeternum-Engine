<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Aeternum — Economy</title><link rel="stylesheet" href="play.css"><script src="play.js" defer></script></head>
<body><main><h1>Aeternum</h1><p>Reference economy client · operator-provisioned accounts</p>
<form id="login"><h2>Sign in</h2><label>Login <input name="login" autocomplete="username" required></label><label>Password <input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form>
<section id="game" hidden><button id="logout">Sign out</button><h2>Settlement</h2><form id="balance"><label>World <input name="world" required></label><label>Account <input name="account" required></label><label>Resource <input name="resource" value="wood" required></label><button>Refresh stock</button></form>
<dl id="stock"></dl><form id="action"><label>Action <select name="type"><option value="economy.settle">Settle production</option><option value="economy.upgrade">Upgrade production</option></select></label><button>Submit action</button></form></section>
<p id="status" role="status" aria-live="polite"></p></main></body></html>
